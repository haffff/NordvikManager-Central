# Sample coturn config for NordvikManager.
# Copy to the VPS (e.g. /etc/coturn/turnserver.conf) and fill in the <...> values.

# --- Auth: short-lived credentials minted by the Central Server (GET /api/ice-servers) ---
use-auth-secret
# Must equal TURN_SECRET in the Central Server's .env (generate: openssl rand -hex 32)
static-auth-secret=<shared-secret>
realm=<turn.example.com>
fingerprint

# --- Listeners ---
listening-port=3478
tls-listening-port=5349
# Public IP of the VPS. If the VPS sits behind 1:1 NAT use: external-ip=<public-ip>/<private-ip>
external-ip=<public-ip>

# UDP port range used for relayed media/data. Open the same range in the firewall.
min-port=49160
max-port=49200

# --- TLS (for turns: URLs) ---
cert=/etc/letsencrypt/live/<turn.example.com>/fullchain.pem
pkey=/etc/letsencrypt/live/<turn.example.com>/privkey.pem
no-tlsv1
no-tlsv1_1

# --- Hardening ---
no-cli
no-multicast-peers
stale-nonce=600
# Stop the relay from being used to reach the VPS's own or private networks.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# Limits: concurrent allocations per user / in total, and per-session bandwidth (bytes/s, 0 = unlimited).
user-quota=12
total-quota=1200
max-bps=0

# --- Logging ---
log-file=stdout
simple-log
