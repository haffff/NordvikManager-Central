<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NordvikManager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 1.5rem;
    }
    h1 { font-size: 2.5rem; letter-spacing: .05em; color: #c9a84c; }
    p  { font-size: 1.1rem; color: #aaa; }
    a  {
      display: inline-block;
      padding: .75rem 2rem;
      background: #c9a84c;
      color: #1a1a2e;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
      transition: opacity .2s;
    }
    a:hover { opacity: .85; }
  </style>
</head>
<body>
  <h1>NordvikManager</h1>
  <p>Tabletop RPG session management</p>
  <p>This website is in process of development, if you are tester, please proceed here</p>
  <a href="/client">Open Game Client</a>
</body>
</html>
